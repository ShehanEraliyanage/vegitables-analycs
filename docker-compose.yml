version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vegetables_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-vegetables_analytics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - veg_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vegetables_backend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_DATABASE:-vegetables_analytics}
      - NODE_ENV=production
    depends_on:
      - postgres
    networks:
      - veg_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vegetables_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - veg_network

networks:
  veg_network:
    driver: bridge

volumes:
  postgres_data:
